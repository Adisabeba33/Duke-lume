<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="brushGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#666"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="34" y="34" width="956" height="956" rx="120"
        fill="#F6F1E8" filter="url(#shadow)"/>

  <!-- subtle paper texture lines -->
  <g opacity="0.12" stroke="#9a8e7b" stroke-width="1">
    <path d="M120 160 C300 140, 520 175, 870 145" fill="none"/>
    <path d="M95 780 C300 760, 650 795, 920 760" fill="none"/>
    <path d="M160 120 C145 320, 170 590, 150 870" fill="none"/>
    <path d="M860 110 C875 300, 850 610, 885 880" fill="none"/>
  </g>

  <!-- typographic lockup -->
  <text x="88" y="430"
        font-family="Cormorant Garamond, Didot, Bodoni MT, Georgia, serif"
        font-size="250" font-weight="500"
        fill="#161616" letter-spacing="-10">Duke</text>

  <text x="455" y="600"
        font-family="Cormorant Garamond, Didot, Bodoni MT, Georgia, serif"
        font-size="155" font-style="italic"
        fill="#9B7B3E">&amp;</text>

  <text x="96" y="830"
        font-family="Cormorant Garamond, Didot, Bodoni MT, Georgia, serif"
        font-size="270" font-weight="500"
        fill="#161616" letter-spacing="-12">Lume</text>

  <!-- expressive brush stroke -->
  <path d="M640 555
           C725 500, 820 470, 940 450
           C905 490, 875 535, 835 590
           C785 615, 730 620, 675 610
           C700 588, 695 572, 640 555 Z"
        fill="#1A1A1A" opacity="0.92"/>

  <path d="M650 560
           C748 525, 828 500, 928 482"
        stroke="#F6F1E8" stroke-width="10" opacity="0.45" fill="none"/>

  <!-- digital brush -->
  <g transform="translate(805 315) rotate(33)">
    <!-- handle -->
    <rect x="0" y="0" width="34" height="220" rx="17" fill="url(#brushGrad)"/>
    <!-- ferrule -->
    <rect x="-4" y="180" width="42" height="48" rx="6" fill="url(#metalGrad)"/>
    <!-- bristles -->
    <path d="M2 226
             C9 265, 16 302, 17 340
             C18 308, 24 270, 32 226 Z"
          fill="#2E241C"/>
    <!-- digital accent pixels -->
    <g fill="#9B7B3E">
      <rect x="-20" y="120" width="8" height="8"/>
      <rect x="-8" y="138" width="6" height="6"/>
      <rect x="42" y="150" width="7" height="7"/>
      <rect x="51" y="132" width="5" height="5"/>
    </g>
  </g>

  <!-- small digital-art marks -->
  <g stroke="#9B7B3E" stroke-width="2" opacity="0.65">
    <path d="M76 418 h42"/>
    <path d="M97 397 v42"/>
    <path d="M872 855 h46"/>
    <path d="M895 832 v46"/>
  </g>
  <g fill="#9B7B3E">
    <rect x="74" y="404" width="7" height="7"/>
    <rect x="913" y="850" width="9" height="9"/>
  </g>
</svg>