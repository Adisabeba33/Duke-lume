<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Small-size brand mark. The full Duke & Lume wordmark lives in
       /public/brand/wordmark.svg and is used for larger icons (apple-icon,
       PWA, Open Graph); at 16–32px it would be unreadable, so the tab icon
       is reduced to the monogram. -->
  <rect width="64" height="64" rx="11" fill="#161616"/>
  <text x="32" y="35" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="27"
        fill="#F6F1E8">D<tspan fill="#C39A55">&amp;</tspan>L</text>
</svg>
